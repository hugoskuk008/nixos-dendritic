# kitty.conf generated by Confitty, https://confitty.app
# Target: Kitty 0.48.0
# Place this file at: ~/.config/kitty/kitty.conf
# Reload without restart: Ctrl+Shift+F5  |  Docs: https://sw.kovidgoyal.net/kitty/conf/
# Only settings that differ from Kitty defaults are included.
shell zsh
confirm_os_window_close 0
# --- Fonts ---
font_family JetBrains Mono
font_size 13
disable_ligatures always
background_opacity  0.7
# --- Cursor ---
cursor #ebdbb2
cursor_text_color #282828
cursor_shape beam
cursor_blink_interval 0

# --- Scrollback ---
scrollback_lines 5000

# --- Mouse ---
url_color #83a598
underline_hyperlinks always
copy_on_select clipboard
strip_trailing_spaces smart

# --- Bell ---
enable_audio_bell no
window_alert_on_bell no

# --- Window Layout ---
remember_window_size no
window_border_width 1pt
window_padding_width 24
active_border_color #fabd2f
inactive_text_alpha 0.75
hide_window_decorations yes

# --- Tab Bar ---
tab_bar_style powerline
active_tab_foreground #ebdbb2
active_tab_background #b16286
inactive_tab_foreground #a79c82
inactive_tab_background #534f46
progress_bar right

# --- Colors ---
foreground #ebdbb2
background #282828
selection_foreground #282828
selection_background #ebdbb2
color0 #282828
color1 #cc241d
color2 #98971a
color3 #d79921
color4 #458588
color5 #b16286
color6 #689d6a
color7 #a89984
color8 #928374
color9 #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2

# --- Advanced ---
allow_remote_control socket-only

